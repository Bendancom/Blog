name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup font installer
      - name: Setup font installer
        uses: fontist/setup-fontist@v2

      # 3, Setup font LXGW 
      - name: Setup font - LxgwWenKai
        run: |
          fontist install --formula "lxgw_wenkai"

      # 4. Setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      # 5. Run build script
      - name: Run build script
        run: |
          uv run build.py deploy

      # 6. Validate build output
      - name: Validate build output
        run: |
          if [ ! -f "./public/index.html" ]; then
            echo "Error: index.html not found in public directory"
            exit 1
          fi
          echo "Build validation passed"

      # 7. Upload Page artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # 8. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
